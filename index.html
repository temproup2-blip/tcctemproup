<!-- =====================================================
     TELA INICIAL
===================================================== -->

<section id="inicio" class="tela-inicial">

    <div class="inicio-conteudo">

        <img
            src="tela-inicial.png"
            alt="Temp.Roup"
            class="imagem-inicial"
        >

        <div class="botoes-inicial">

            <button
                class="btn-cadastrar"
                onclick="mostrarCadastro()"
            >
                CADASTRAR-SE
            </button>

            <button
                class="btn-entrar"
                onclick="mostrarLogin()"
            >
                ENTRAR
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     CADASTRO
===================================================== -->

<section id="cadastro" class="tela-formulario">

    <div class="formulario">

        <div class="logo-form">
            <span>TEMP</span>
            <strong>ROUP</strong>
        </div>

        <h1>Criar conta</h1>

        <p class="subtitulo">
            Preencha seus dados para criar sua conta
        </p>

        <div class="campo">

            <label for="cadNome">
                Nome completo:
            </label>

            <input
                type="text"
                id="cadNome"
                placeholder="Digite seu nome completo"
            >

        </div>


        <div class="campo">

            <label for="cadEmail">
                E-mail:
            </label>

            <input
                type="email"
                id="cadEmail"
                placeholder="Digite seu e-mail"
            >

        </div>


        <div class="campo">

            <label for="cadSenha">
                Senha:
            </label>

            <div class="senha">

                <input
                    type="password"
                    id="cadSenha"
                    placeholder="Digite sua senha"
                >

                <button
                    type="button"
                    onclick="mostrarSenha('cadSenha')"
                >
                    👁
                </button>

            </div>

        </div>


        <div class="campo">

            <label for="confirmarSenha">
                Confirmar senha:
            </label>

            <div class="senha">

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua senha"
                >

                <button
                    type="button"
                    onclick="mostrarSenha('confirmarSenha')"
                >
                    👁
                </button>

            </div>

        </div>


        <div class="termos">

            <input
                type="checkbox"
                id="aceitarTermos"
            >

            <label for="aceitarTermos">
                Eu aceito os
                <span>Termos de Uso</span>
                e a
                <span>Política de Privacidade</span>
            </label>

        </div>


        <button
            class="btn-principal"
            onclick="cadastrar()"
        >
            CADASTRAR
        </button>


        <p class="troca">

            Já tem uma conta?

            <span onclick="mostrarLogin()">
                Entrar
            </span>

        </p>


        <button
            class="voltar"
            onclick="mostrarInicio()"
        >
            ← Voltar
        </button>

    </div>

</section>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="login" class="tela-formulario">

    <div class="formulario">

        <div class="logo-form">
            <span>TEMP</span>
            <strong>ROUP</strong>
        </div>

        <h1>
            Entrar na sua conta
        </h1>

        <p class="subtitulo">
            Que bom te ver de novo!
            <br>
            Faça login para continuar.
        </p>


        <div class="campo">

            <label for="loginEmail">
                E-mail ou telefone:
            </label>

            <input
                type="text"
                id="loginEmail"
                placeholder="Digite seu e-mail ou telefone"
            >

        </div>


        <div class="campo">

            <label for="loginSenha">
                Senha:
            </label>

            <div class="senha">

                <input
                    type="password"
                    id="loginSenha"
                    placeholder="Digite sua senha"
                >

                <button
                    type="button"
                    onclick="mostrarSenha('loginSenha')"
                >
                    👁
                </button>

            </div>

        </div>


        <p class="esqueceu">
            Esqueceu a senha?
        </p>


        <button
            class="btn-principal"
            onclick="fazerLogin()"
        >
            ENTRAR
        </button>


        <div class="ou">

            <span></span>

            <p>Ou entre com</p>

            <span></span>

        </div>


        <div class="sociais">

            <button onclick="loginGoogle()">
                G
            </button>

            <button onclick="loginFacebook()">
                f
            </button>

            <button onclick="loginApple()">
                
            </button>

        </div>


        <p class="troca">

            Ainda não tem uma conta?

            <span onclick="mostrarCadastro()">
                Cadastrar
            </span>

        </p>


        <button
            class="voltar"
            onclick="mostrarInicio()"
        >
            ← Voltar
        </button>

    </div>

</section>
